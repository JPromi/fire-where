name: Android Play Store

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Base version for develop build"
        required: true
        default: "0.0.0"

jobs:
  build:
    name: Build and upload AAB
    runs-on: ubuntu-latest
    environment: Play Store
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: |
          {
            echo 'API_BASE_URL="${{ vars.API_BASE_URL }}"'
            echo 'INFO_APP_NAME="${{ vars.INFO_APP_NAME }}"'
            echo 'INFO_DEVELOPER_NAME="${{ vars.INFO_DEVELOPER_NAME }}"'
            echo 'INFO_DEVELOPER_WEBSITE="${{ vars.INFO_DEVELOPER_WEBSITE }}"'
            echo 'INFO_APP_WEB_URL="${{ vars.INFO_APP_WEB_URL }}"'
            echo 'INFO_APP_FEEDBACK_EMAIL="${{ vars.INFO_APP_FEEDBACK_EMAIL }}"'
            echo 'INFO_APP_REPO_NAME="${{ vars.INFO_APP_REPO_NAME }}"'
            echo 'INFO_APP_REPO_URL="${{ vars.INFO_APP_REPO_URL }}"'
            echo 'INFO_APP_IMPRINT_URL="${{ vars.INFO_APP_IMPRINT_URL }}"'
            echo 'INFO_APP_PRIVACY_URL="${{ vars.INFO_APP_PRIVACY_URL }}"'
          } > .env

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            RELEASE_NAME="v${VERSION_NAME}"
          else
            VERSION_NAME="${{ inputs.version }}-dev.${GITHUB_RUN_NUMBER}"
            RELEASE_NAME="${VERSION_NAME}"
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

          echo "Version: $VERSION_NAME"
          echo "Version Code: $GITHUB_RUN_NUMBER"

      - name: Restore signing keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew app:bundleRelease \
            -Pandroid.version="$VERSION_NAME" \
            -Pandroid.versionCode="$VERSION_CODE"

      - name: Verify AAB signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release tag to Google Play
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.jpromi.firePoint
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          releaseName: ${{ env.RELEASE_NAME }}

      - name: Upload develop build to Google Play
        if: github.event_name == 'workflow_dispatch'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.jpromi.firePoint
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          releaseName: ${{ env.RELEASE_NAME }}